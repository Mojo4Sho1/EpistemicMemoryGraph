version: "v0.1q"
phase2:
  phase_id: "P2"
  objective: "local_non_china_small_model_screening"
  execution_scope: "local_only"
  invocation_api: "openai_compatible_http"
  stages:
    - "P2-S1"
    - "P2-S2A"
    - "P2-S2B"
    - "P2-S3"
    - "P2-S4"
  model_panel:
    - model_id: "meta_llama3.2_1b_instruct"
      parameter_scale: "~1B"
      provider_org: "Meta"
      origin_country: "United States"
      compliance_class: "allowed_university"
    - model_id: "google_gemma3_1b"
      parameter_scale: "~1B"
      provider_org: "Google"
      origin_country: "United States"
      compliance_class: "allowed_university"
    - model_id: "microsoft_phi4_mini"
      parameter_scale: "~3-4B"
      provider_org: "Microsoft"
      origin_country: "United States"
      compliance_class: "allowed_university"
  compliance_policy:
    enforce_for_all_environments: true
    disallowed_origin_countries: ["China"]
  local_screening:
    required_model_count: 3
    stage_id: "P2-S2A"
    freeze_prompt_template_family: "phase2-default-v1"
    freeze_tool_availability: ["record_observation", "request_consolidation"]
  policy_ablations:
    stage_id: "P2-S2B"
    required_order:
      - "remove_provenance_weighting"
      - "remove_source_independence"
      - "remove_staleness_decay"
      - "remove_triggered_test_loop"
  server_transition_gate:
    deferred_until_local_s2a_s2b_complete: true
    require_non_china_shortlist: true
  required_seed_set: [101, 202, 303, 404, 505]
  statistical_gate:
    confidence_level: 0.95
    alpha: 0.05
    min_effect_size: 0.20
    require_bootstrap_ci: true
    require_paired_nonparametric_test: true
    require_effect_size_threshold: true
  decision_gate:
    field_name: "P2_GATE_STATUS"
    allowed_values: ["OPEN", "LOCKED_PROCEED", "LOCKED_DEFER"]
  findings_report:
    required: true
    artifact_filename: "findings_summary.md"
runtime:
  openai_compatible:
    provider: "ollama"
    base_url: "http://localhost:11434/v1"
    api_key_env: "OLLAMA_API_KEY"
    api_key_fallback: "ollama-local"
    timeout_seconds: 120
    default_max_tokens: 64
    default_temperature: 0.0
  model_id_aliases:
    meta_llama3.2_1b_instruct: "llama3.2:1b"
    google_gemma3_1b: "gemma3:1b"
    microsoft_phi4_mini: "phi4-mini"
stages:
  order:
    - policy_correctness
    - governance_stress
    - baseline_comparison
    - long_horizon
  policy_correctness:
    pass_criterion_percent: 100
  governance_stress:
    seeds: [101, 202, 303, 404, 505]
  baseline_comparison:
    minimum_relative_policy_improvement_percent: 10
    minimum_policy_metrics_improved_count: 3
    max_task_success_absolute_drop_percent: 3
  long_horizon:
    requires_governance_and_continuity_improvement: true
fairness_contract:
  require_same_model_snapshot: true
  require_same_prompt_template_family: true
  require_same_tool_availability: true
  require_same_token_budget: true
  require_same_wall_clock_timeout: true
  require_same_seed_set: true
logging:
  required_files:
    - manifest.json
    - config_snapshot.yaml
    - transitions.jsonl
    - consolidation_events.jsonl
    - scenario_results.jsonl
    - metrics_summary.json
    - findings_summary.md
  path_template: "artifacts/{date}_{git_sha}_{system}_{seed}/"
